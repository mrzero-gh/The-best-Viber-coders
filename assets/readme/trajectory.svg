    <text x="28" y="76" font-size="20" fill="#5A5E62">законные ловушки: 4 из 4 обойдены</text>
    <text x="24" y="156" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="64" font-weight="700" fill="#2F7D4F">+0.954</text>
