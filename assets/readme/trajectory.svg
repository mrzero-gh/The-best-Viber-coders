<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Реплей агента: эпизод EP-0HJPAE81</title>
  <desc id="desc">Эвристический аудитор из trajectories.jsonl проходит эпизод EP-0HJPAE81 за 24 шага. Шаги 1–8: list_records по счетам, платежам и курсам. Шаги 9–15: семь страниц главной книги по 50 строк. Шаги 16–23: get_document по восьми подозрительным документам. Шаг 24: submit с девятью выводами: два дубликата счёта, три ошибки разнесения платежа, две ошибки периода, две ошибки курса. Подтверждено 9 из 9, ложных выводов 0, четыре законные ловушки обойдены, награда +0.954 = 2·F1 − 1 − 0.002·23.</desc>

